name: gaming-platform

# All deployment-time settings come from .env via Compose interpolation.
# Required values have no fallback, so a half-configured deployment stops
# before any container starts.
x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  # One knob for the whole fleet; keep services * max below postgres max_connections.
  DB_POOL_MAX: ${DB_POOL_MAX:-5}
  # Must embed REDIS_PASSWORD; a missing URL fails the deploy (no anonymous Redis).
  REDIS_URL: ${REDIS_URL:?REDIS_URL must include the Redis password}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be at least 32 random characters}
  # Capability credentials are intentionally NOT shared here. Each service
  # below receives only the token(s) its own code verifies; the gateway holds
  # all of them because it is the component that injects them per route.
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be the public browser origin}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  REALTIME_URL: http://realtime:3010
  WALLET_URL: http://wallet:3011
  RESPONSIBLE_GAMING_URL: http://responsible-gaming:3012
  ADMIN_RISK_URL: http://admin-risk:3013

x-app: &app
  build: .
  working_dir: /app
  restart: unless-stopped
  # Peers and data services live on a non-routable internal network; only the
  # gateway joins the public network (overridden in its own service block).
  networks:
    - internal
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  # Services keep no runtime state on disk; /tmp is a scratch tmpfs only.
  read_only: true
  tmpfs:
    - /tmp
  # Give SIGTERM handlers time to drain requests and close their DB pools.
  stop_grace_period: 25s
  # Bound each process so one leaking service cannot OOM the host.
  mem_limit: 512m
  cpus: 1.0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck: &app-health
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+process.env.PORT+'/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 20s

services:
  postgres:
    # Exact patch tag + published multi-arch index digest.
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    # 15 app services x DB_POOL_MAX(5) + the LISTEN connection + migrations
    # stays well under this ceiling; the default 100 would be exhausted.
    command: ["postgres", "-c", "max_connections=200"]
    # No host port: the database is reachable only from the internal network.
    networks:
      - internal
    # The stock entrypoint needs CHOWN/SETUID to hand the volume to postgres,
    # so capabilities stay intact here while process/CPU/memory are bounded.
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-gaming_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:-gaming_platform}
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Exact patch tag + published multi-arch index digest.
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    # Password enforced by the server; clients receive it only through
    # REDIS_URL on the internal network. REDISCLI_AUTH authenticates probes.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # $$ keeps interpolation in the container shell, not in Compose.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    # 999:1000 is the redis user/group shipped by the official alpine image.
    user: "999:1000"
    # No host port: internal network only.
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp
    # /data is a named volume, so AOF/RDB writes survive a read-only root FS.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies every migration on first boot and on every upgrade,
  # including when an existing pgdata volume is reused.
  migrate:
    build: .
    working_dir: /app
    command: node scripts/migrate.js
    restart: "no"
    # The migrator only opens Postgres; it must not inherit the fleet's
    # secrets or capability tokens.
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *app
    command: node services/gateway/index.js
    # The only service with a public interface; peers stay on the internal net.
    networks:
      - public
      - internal
    environment:
      <<: *common-env
      PORT: 3000
      UPSTREAM_MODE: docker
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN must be at least 32 random characters}
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?ADMIN_SERVICE_TOKEN must be set}
      WALLET_SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN:?WALLET_SERVICE_TOKEN must be set}
      REALTIME_SERVICE_TOKEN: ${REALTIME_SERVICE_TOKEN:?REALTIME_SERVICE_TOKEN must be set}
      PROMOTIONS_SERVICE_TOKEN: ${PROMOTIONS_SERVICE_TOKEN:?PROMOTIONS_SERVICE_TOKEN must be set}
      CRASH_SERVICE_TOKEN: ${CRASH_SERVICE_TOKEN:?CRASH_SERVICE_TOKEN must be set}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?ADMIN_BOOTSTRAP_TOKEN must be set}
      # Player-facing abuse controls; counters are shared through REDIS_URL.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-120}
      RATE_LIMIT_MUTATE_MAX: ${RATE_LIMIT_MUTATE_MAX:-30}
      # Fail closed if Redis is down: never silently drop to local counters.
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-true}
      RATE_LIMIT_STREAM_MAX: ${RATE_LIMIT_STREAM_MAX:-20}
      MAX_STREAMS: ${MAX_STREAMS:-500}
      EVENT_RETENTION_HOURS: ${EVENT_RETENTION_HOURS:-168}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "3000:3000"

  auth:
    <<: *app
    command: node services/auth/index.js
    environment:
      <<: *common-env
      PORT: 3015
    expose:
      - "3015"

  admin-risk:
    <<: *app
    command: node services/admin-risk/index.js
    environment:
      <<: *common-env
      PORT: 3013
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?ADMIN_SERVICE_TOKEN must be set}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?ADMIN_BOOTSTRAP_TOKEN must be set}
    expose:
      - "3013"

  realtime:
    <<: *app
    command: node services/realtime/index.js
    environment:
      <<: *common-env
      PORT: 3010
      REALTIME_SERVICE_TOKEN: ${REALTIME_SERVICE_TOKEN:?REALTIME_SERVICE_TOKEN must be set}
      # Bounded event log / concurrent stream budget for SSE fan-out.
      MAX_STREAMS: ${MAX_STREAMS:-500}
      EVENT_RETENTION_HOURS: ${EVENT_RETENTION_HOURS:-168}
    expose:
      - "3010"

  wallet:
    <<: *app
    command: node services/wallet/index.js
    environment:
      <<: *common-env
      PORT: 3011
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN must be at least 32 random characters}
      # The wallet verifies all four: the full gateway/test/admin capability
      # and the three operation/type-scoped peer capabilities.
      WALLET_SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN:?WALLET_SERVICE_TOKEN must be set}
      WALLET_DEBIT_SERVICE_TOKEN: ${WALLET_DEBIT_SERVICE_TOKEN:?WALLET_DEBIT_SERVICE_TOKEN must be set}
      WALLET_BONUS_SERVICE_TOKEN: ${WALLET_BONUS_SERVICE_TOKEN:?WALLET_BONUS_SERVICE_TOKEN must be set}
      WALLET_WIN_SERVICE_TOKEN: ${WALLET_WIN_SERVICE_TOKEN:?WALLET_WIN_SERVICE_TOKEN must be set}
    expose:
      - "3011"

  responsible-gaming:
    <<: *app
    command: node services/responsible-gaming/index.js
    environment:
      <<: *common-env
      PORT: 3012
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN must be at least 32 random characters}
    expose:
      - "3012"

  tournaments:
    <<: *app
    command: node services/tournaments/index.js
    environment:
      <<: *common-env
      PORT: 3014
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN must be at least 32 random characters}
    expose:
      - "3014"

  chat:
    <<: *app
    command: node services/chat/dist/index.js
    environment:
      <<: *common-env
      PORT: 3016
      REALTIME_SERVICE_TOKEN: ${REALTIME_SERVICE_TOKEN:?REALTIME_SERVICE_TOKEN must be set}
    expose:
      - "3016"

  codenames:
    <<: *app
    command: node services/codenames/dist/index.js
    environment:
      <<: *common-env
      PORT: 3017
    expose:
      - "3017"

  game-engine:
    <<: *app
    command: node services/game-engine/dist/index.js
    environment:
      <<: *common-env
      PORT: 3018
    expose:
      - "3018"

  gin-rummy:
    <<: *app
    command: node services/gin-rummy/dist/index.js
    environment:
      <<: *common-env
      PORT: 3019
    expose:
      - "3019"

  leaderboard:
    <<: *app
    command: node services/leaderboard/dist/index.js
    environment:
      <<: *common-env
      PORT: 3020
    expose:
      - "3020"

  pictionary:
    <<: *app
    command: node services/pictionary/dist/index.js
    environment:
      <<: *common-env
      PORT: 3021
    expose:
      - "3021"

  promotions:
    <<: *app
    command: node services/promotions/dist/index.js
    environment:
      <<: *common-env
      PORT: 3022
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN must be at least 32 random characters}
      PROMOTIONS_SERVICE_TOKEN: ${PROMOTIONS_SERVICE_TOKEN:?PROMOTIONS_SERVICE_TOKEN must be set}
      # Claims only ever credit type=bonus. The full token is passed only for
      # legacy wallet compatibility and is ignored when x-wallet-scope is set.
      WALLET_SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN:?WALLET_SERVICE_TOKEN must be set}
      WALLET_BONUS_SERVICE_TOKEN: ${WALLET_BONUS_SERVICE_TOKEN:?WALLET_BONUS_SERVICE_TOKEN must be set}
    expose:
      - "3022"

  # Unified Aviator/crash game. Its wallet capabilities are scoped to stakes
  # (debits) and win credits; it never receives the full wallet token, the
  # admin token or the promotions token.
  crash:
    <<: *app
    command: node services/crash/index.js
    environment:
      <<: *common-env
      PORT: 3023
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN must be at least 32 random characters}
      CRASH_SERVICE_TOKEN: ${CRASH_SERVICE_TOKEN:?CRASH_SERVICE_TOKEN must be set}
      # Temporary rollout compatibility for an older wallet container; the
      # upgraded wallet ignores this header when x-wallet-scope is present.
      WALLET_SERVICE_TOKEN: ${WALLET_SERVICE_TOKEN:?WALLET_SERVICE_TOKEN must be set}
      WALLET_DEBIT_SERVICE_TOKEN: ${WALLET_DEBIT_SERVICE_TOKEN:?WALLET_DEBIT_SERVICE_TOKEN must be set}
      WALLET_WIN_SERVICE_TOKEN: ${WALLET_WIN_SERVICE_TOKEN:?WALLET_WIN_SERVICE_TOKEN must be set}
      REALTIME_SERVICE_TOKEN: ${REALTIME_SERVICE_TOKEN:?REALTIME_SERVICE_TOKEN must be set}
      WALLET_INTERNAL_URL: http://wallet:3011
      REALTIME_INTERNAL_URL: http://realtime:3010
    expose:
      - "3023"

volumes:
  pgdata:
  redisdata:

# Only the gateway attaches to `public`. Data services and all peers are on
# `internal`, which has no route to the internet or the host port namespace.
networks:
  public: {}
  internal:
    internal: true
