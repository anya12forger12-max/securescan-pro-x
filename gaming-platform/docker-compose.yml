name: gaming-platform

# All deployment-time settings come from .env via Compose interpolation.
# Required values have no fallback, so a half-configured deployment stops
# before any container starts.
x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be at least 32 random characters}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN must be at least 32 random characters}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be the public browser origin}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  REALTIME_URL: http://realtime:3010
  WALLET_URL: http://wallet:3011
  RESPONSIBLE_GAMING_URL: http://responsible-gaming:3012
  ADMIN_RISK_URL: http://admin-risk:3013

x-app: &app
  build: .
  working_dir: /app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck: &app-health
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 10s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-gaming_platform}
    # Loopback only: the gateway is the sole public entry point.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:-gaming_platform}
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies every migration on first boot and on every upgrade,
  # including when an existing pgdata volume is reused.
  migrate:
    build: .
    working_dir: /app
    command: node scripts/migrate.js
    restart: "no"
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *app
    command: node services/gateway/index.js
    environment:
      <<: *common-env
      PORT: 3000
      UPSTREAM_MODE: docker
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "3000:3000"

  auth:
    <<: *app
    command: node services/auth/index.js
    environment:
      <<: *common-env
      PORT: 3015
    ports:
      - "127.0.0.1:3015:3015"

  admin-risk:
    <<: *app
    command: node services/admin-risk/index.js
    environment:
      <<: *common-env
      PORT: 3013
    ports:
      - "127.0.0.1:3013:3013"

  realtime:
    <<: *app
    command: node services/realtime/index.js
    environment:
      <<: *common-env
      PORT: 3010
    ports:
      - "127.0.0.1:3010:3010"

  wallet:
    <<: *app
    command: node services/wallet/index.js
    environment:
      <<: *common-env
      PORT: 3011
    ports:
      - "127.0.0.1:3011:3011"

  responsible-gaming:
    <<: *app
    command: node services/responsible-gaming/index.js
    environment:
      <<: *common-env
      PORT: 3012
    ports:
      - "127.0.0.1:3012:3012"

  tournaments:
    <<: *app
    command: node services/tournaments/index.js
    environment:
      <<: *common-env
      PORT: 3014
    ports:
      - "127.0.0.1:3014:3014"

  chat:
    <<: *app
    command: node services/chat/dist/index.js
    environment:
      <<: *common-env
      PORT: 3016
    ports:
      - "127.0.0.1:3016:3016"

  codenames:
    <<: *app
    command: node services/codenames/dist/index.js
    environment:
      <<: *common-env
      PORT: 3017
    ports:
      - "127.0.0.1:3017:3017"

  game-engine:
    <<: *app
    command: node services/game-engine/dist/index.js
    environment:
      <<: *common-env
      PORT: 3018
    ports:
      - "127.0.0.1:3018:3018"

  gin-rummy:
    <<: *app
    command: node services/gin-rummy/dist/index.js
    environment:
      <<: *common-env
      PORT: 3019
    ports:
      - "127.0.0.1:3019:3019"

  leaderboard:
    <<: *app
    command: node services/leaderboard/dist/index.js
    environment:
      <<: *common-env
      PORT: 3020
    ports:
      - "127.0.0.1:3020:3020"

  pictionary:
    <<: *app
    command: node services/pictionary/dist/index.js
    environment:
      <<: *common-env
      PORT: 3021
    ports:
      - "127.0.0.1:3021:3021"

  promotions:
    <<: *app
    command: node services/promotions/dist/index.js
    environment:
      <<: *common-env
      PORT: 3022
    ports:
      - "127.0.0.1:3022:3022"

volumes:
  pgdata:
  redisdata:
