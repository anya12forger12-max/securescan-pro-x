name: SecureScan Pro X CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.8" "mypy==2.3.1"
      - name: Ruff check
        working-directory: backend
        run: ruff check app/
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check app/
      # 78 known annotation gaps remain (strict mode). Not a gate until resolved;
      # intentionally tolerant so type drift is visible without failing the build.
      - name: MyPy type check
        working-directory: backend
        run: mypy app/ --ignore-missing-imports || true

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        continue-on-error: true
      - name: Run tests
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install bandit
        continue-on-error: true
      - name: Bandit security scan
        working-directory: backend
        run: bandit -r app/ -ll --skip B101

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install
        continue-on-error: true
      - name: TypeScript check
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Format check
        working-directory: frontend
        run: pnpm format:check

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install
        continue-on-error: true
      - name: Run tests
        working-directory: frontend
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.32.1 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install
        continue-on-error: true
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: warn

  gaming-platform:
    name: Gaming Platform (checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: gaming-platform
        run: npm ci
      - name: Syntax check
        working-directory: gaming-platform
        run: npm run check
      - name: TypeScript typecheck
        working-directory: gaming-platform
        run: npm run typecheck
      - name: Install frontend dependencies
        working-directory: gaming-platform
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Frontend typecheck
        working-directory: gaming-platform
        run: npm run frontend:typecheck
      - name: Frontend build
        working-directory: gaming-platform
        run: npm run frontend:build
      - name: Compose validation
        working-directory: gaming-platform
        run: npm run validate:compose
      - name: Dependency audit
        working-directory: gaming-platform
        run: npm audit --omit=dev

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/dev/Dockerfile
          push: false
          tags: securescan-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max