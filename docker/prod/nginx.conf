# nginx config for the production frontend image.
# Runs entirely as the unprivileged "nginx" user on port 8080.

worker_processes auto;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # All temp paths are under /tmp/nginx, which is owned by the nginx user in
    # the image. (Otherwise nginx tries to create compiled-in /var/... dirs.)
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Used by the container HEALTHCHECK and Compose healthcheck.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Same-origin backend access for builds made with VITE_API_URL=/api/v1.
        # The resolver + variable form avoids a startup failure when the
        # backend container is not up yet (Docker's embedded DNS is 127.0.0.11).
        location /api/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $api_upstream http://backend:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # React Router history fallback: unknown paths serve index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
