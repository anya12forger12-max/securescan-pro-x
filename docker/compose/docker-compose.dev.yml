# Docker Compose — Development Environment

services:
  backend:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
      - securescan-data:/root/.securescan
    environment:
      - SECURESCAN_DEBUG=true
      # Backend settings use "__" for nesting; SECURESCAN_LOG_LEVEL was ignored.
      - SECURESCAN_LOGGING__LEVEL=debug
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:1420:1420"
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 127.0.0.1 --port 1420"

volumes:
  securescan-data:
