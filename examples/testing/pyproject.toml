[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mhcp-example-testing"
version = "0.1.0"
description = "Testing patterns and examples for Malware Hash Checker Pro"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "mhcp-core>=0.1.0",
    "mhcp-hashing>=0.1.0",
    "mhcp-scanner>=0.1.0",
    "mhcp-database>=0.1.0",
    "mhcp-security>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (multiple components)",
    "e2e: End-to-end tests (full workflow)",
    "security: Security regression tests",
    "slow: Tests that take more than 5 seconds",
]
