[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mhcp-example-plugin"
version = "0.1.0"
description = "Plugin development examples for Malware Hash Checker Pro"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "mhcp-core>=0.1.0",
    "mhcp-hashing>=0.1.0",
    "mhcp-scanner>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
