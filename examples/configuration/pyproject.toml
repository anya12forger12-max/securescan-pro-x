[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mhcp-example-configuration"
version = "0.1.0"
description = "Configuration management examples for Malware Hash Checker Pro"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "mhcp-core>=0.1.0",
    "mhcp-config>=0.1.0",
]

[project.optional-dependencies]
toml = ["tomli>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]
